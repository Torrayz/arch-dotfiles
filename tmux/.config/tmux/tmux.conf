# =============================================================================
# Tmux Configuration — Catppuccin Mocha & Developer Workflow
# =============================================================================

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support (click panes, resize, scroll)
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster escape time for Neovim/Vim
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Reload config with Prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# Intuitive Split Panes (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (Alt + h/j/k/l without prefix!)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Statusbar Position & Catppuccin Mocha Theme
set-option -g status-position top
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[bg=#cba6f7,fg=#11111b,bold]  #S #[bg=#181825,fg=#cba6f7] "

set -g status-right-length 80
set -g status-right "#[fg=#313244]#[bg=#313244,fg=#cdd6f4] 󰉋 #{b:pane_current_path} #[fg=#89b4fa]#[bg=#89b4fa,fg=#11111b,bold] 󰥔 %H:%M "

setw -g window-status-format "#[bg=#181825,fg=#a6adc8]  #I:#W  "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold]  #I:#W*  "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cba6f7"
