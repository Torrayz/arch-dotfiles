# =============================================================================
# Picom v13 Configuration — Smooth Animations & Tear-Free for Intel Haswell iGPU
# =============================================================================

backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

shadow = false;
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 4;
fade-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

corner-radius = 8;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";

# -----------------------------------------------------------------------------
# Dual-Kawase Frosted Glass Background Blur (GPU Accelerated)
# -----------------------------------------------------------------------------
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS"
];

# Window Opacity Rules (Frosted Glass Translucency)
opacity-rule = [
  "92:class_g = 'Polybar'",
  "90:class_g = 'Rofi'",
  "92:class_g = 'Torray-hub.py'",
  "92:class_g = 'Torray-clip.py'",
  "92:class_g = 'dunst'"
];

# Smooth Window & Workspace Transitions (Picom v13)
animations = (
  {
    triggers = ["close", "hide"];
    opacity = {
      curve = "linear";
      duration = 0.12;
      start = "window-raw-opacity-before";
      end = 0;
    };
    scale-x = {
      curve = "cubic-bezier(0.25, 1, 0.5, 1)";
      duration = 0.12;
      start = 1;
      end = 0.94;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
  },
  {
    triggers = ["open", "show"];
    opacity = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.15;
      start = 0;
      end = "window-raw-opacity";
    };
    scale-x = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.15;
      start = 0.93;
      end = 1;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
  },
  {
    triggers = ["geometry"];
    scale-x = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.16;
      start = "window-width-before / window-width";
      end = 1;
    };
    scale-y = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.16;
      start = "window-height-before / window-height";
      end = 1;
    };
    offset-x = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.16;
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.16;
      start = "window-y-before - window-y";
      end = 0;
    };
  }
);
