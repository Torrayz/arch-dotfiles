# =============================================================================
# Picom v13 Configuration — Smooth Animations & Tear-Free for Intel Haswell iGPU
# =============================================================================

backend = "glx";
vsync = true;
use-damage = true;

shadow = false;
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 4;

corner-radius = 0;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";

# Smooth Window & Workspace Transitions (Picom v13)
animations = (
  {
    triggers = ["close", "hide"];
    opacity = {
      curve = "linear";
      duration = 0.12;
      start = "window-raw-opacity-before";
      end = 0;
    };
    scale-x = {
      curve = "cubic-bezier(0.25, 1, 0.5, 1)";
      duration = 0.12;
      start = 1;
      end = 0.94;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
  },
  {
    triggers = ["open", "show"];
    opacity = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.15;
      start = 0;
      end = "window-raw-opacity";
    };
    scale-x = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.15;
      start = 0.93;
      end = 1;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
  },
  {
    triggers = ["geometry"];
    scale-x = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.16;
      start = "window-width-before / window-width";
      end = 1;
    };
    scale-y = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.16;
      start = "window-height-before / window-height";
      end = 1;
    };
    offset-x = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.16;
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0.22, 1, 0.36, 1)";
      duration = 0.16;
      start = "window-y-before - window-y";
      end = 0;
    };
  }
);
