# =============================================================================
# Picom Configuration — Lightweight & Tear-Free for Intel Haswell iGPU
# =============================================================================

backend = "glx";
vsync = true;
use-damage = true;

# Keep shadows and blur off for maximum smoothness and low CPU/GPU usage
shadow = false;
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

corner-radius = 0;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";
