"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"
add_newline = true

format = """
[╭─](surface2)\
[](mauve)\
$os\
$username\
[](bg:surface0 fg:mauve)\
$directory\
[](bg:surface1 fg:surface0)\
$git_branch\
$git_status\
[](fg:surface1)\
$fill\
$nodejs\
$python\
$rust\
$golang\
$cmd_duration\
$time\
$line_break\
[╰─](surface2)$character"""

[os]
disabled = false
style = "bg:mauve fg:crust bold"

[os.symbols]
Arch = "󰣇 "
Linux = " "

[username]
show_always = true
style_user = "bg:mauve fg:crust bold"
style_root = "bg:red fg:crust bold"
format = '[$user ]($style)'

[directory]
style = "bg:surface0 fg:text bold"
format = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:surface1 fg:lavender bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:surface1 fg:peach bold"
format = '[$all_status$ahead_behind ]($style)'

[fill]
symbol = "·"
style = "fg:surface0"

[nodejs]
symbol = " "
style = "bg:green fg:crust bold"
format = ' [](fg:green)[$symbol$version]($style)[](fg:green)'

[python]
symbol = " "
style = "bg:yellow fg:crust bold"
format = ' [](fg:yellow)[$symbol$version]($style)[](fg:yellow)'

[rust]
symbol = " "
style = "bg:peach fg:crust bold"
format = ' [](fg:peach)[$symbol$version]($style)[](fg:peach)'

[golang]
symbol = " "
style = "bg:sapphire fg:crust bold"
format = ' [](fg:sapphire)[$symbol$version]($style)[](fg:sapphire)'

[cmd_duration]
min_time = 1000
style = "bg:peach fg:crust bold"
format = ' [](fg:peach)[󱦟 $duration]($style)[](fg:peach)'

[time]
disabled = false
time_format = "%H:%M"
style = "bg:surface0 fg:subtext1"
format = ' [](fg:surface0)[󰥔 $time]($style)[](fg:surface0)'

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
