; =============================================================================
; Polybar Floating Pill / Island Config — Dank-Inspired Interactive Edition
; Calibrated for 1366x768 Screen
; =============================================================================

[colors]
trans    = #00000000
base     = #1e1e2e
mantle   = #181825
crust    = #11111b
text     = #cdd6f4
subtext0 = #a6adc8
surface0 = #313244
surface1 = #45475a
overlay0 = #6c7086
mauve    = #cba6f7
blue     = #89b4fa
sapphire = #74c7ec
green    = #a6e3a1
yellow   = #f9e2af
peach    = #fab387
red      = #f38ba8
lavender = #b4befe

[bar/main]
width = 100%
height = 20pt
radius = 0
background = ${colors.trans}
foreground = ${colors.text}

; Floating spacing from screen edges
border-top-size = 3pt
border-bottom-size = 0pt
border-left-size = 6pt
border-right-size = 6pt
border-color = ${colors.trans}

padding-left = 0
padding-right = 0
module-margin = 0

; Font 0: Main text & icons | Font 1: Pill caps ( ) | Font 2: Workspace dots
font-0 = "JetBrainsMono Nerd Font:size=8.5:weight=semibold;2"
font-1 = "JetBrainsMono Nerd Font:size=13:weight=regular;3"
font-2 = "JetBrainsMono Nerd Font:size=9.5:weight=bold;2"

modules-left = dash gap capL xworkspaces capR gap capL2 quickterm sep quickcode sep quickkeys capR2
modules-center = capL clock_toggle capR
modules-right = capL sysinfo_toggle capR gap capL hw_bright sep pulseaudio sep net_toggle sep battery capR gap systray gap power

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; -----------------------------------------------------------------------------
; Pill Caps & Spacers
; -----------------------------------------------------------------------------
[module/gap]
type = custom/text
content = "  "

[module/sep]
type = custom/text
content = "  "
content-background = ${colors.base}

[module/capL]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.base}

[module/capR]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.base}

[module/capL2]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.surface0}

[module/capR2]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.surface0}

; -----------------------------------------------------------------------------
; LEFT ISLAND: Torray Dash + Dynamic Dot Workspaces + Quick Action Icons
; -----------------------------------------------------------------------------
[module/dash]
type = custom/text
content = "%{T2}%{F#cba6f7}%{F-}%{T-}%{B#cba6f7}%{F#11111b} 󰣇 %{F-}%{B-}%{T2}%{F#cba6f7}%{F-}%{T-}"
click-left = ~/.config/rofi/dashboard.sh
click-right = rofi -show drun -show-icons

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = false
enable-click = true
enable-scroll = true

format = <label-state>
format-background = ${colors.base}

; Active workspace transforms into glowing Mauve pill icon
label-active = "%{T3}󰮯%{T-}"
label-active-foreground = ${colors.mauve}
label-active-background = ${colors.base}
label-active-padding = 1

; Occupied workspace shows bright circle
label-occupied = "%{T3}%{T-}"
label-occupied-foreground = ${colors.blue}
label-occupied-background = ${colors.base}
label-occupied-padding = 1

; Urgent workspace
label-urgent = "%{T3}%{T-}"
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.base}
label-urgent-padding = 1

; Empty workspace shows subtle dot
label-empty = "%{T3}%{T-}"
label-empty-foreground = ${colors.overlay0}
label-empty-background = ${colors.base}
label-empty-padding = 1

[module/quickterm]
type = custom/text
content = "󰆍"
content-background = ${colors.surface0}
content-foreground = ${colors.green}
click-left = wezterm start

[module/quickcode]
type = custom/text
content = "󰨞"
content-background = ${colors.surface0}
content-foreground = ${colors.blue}
click-left = code

[module/quickkeys]
type = custom/text
content = "󰌌"
content-background = ${colors.surface0}
content-foreground = ${colors.peach}
click-left = ~/.config/rofi/keybindings.sh

; -----------------------------------------------------------------------------
; CENTER ISLAND: Interactive Expandable Clock (Click to Expand Date, Right-Click Wallpaper)
; -----------------------------------------------------------------------------
[module/clock_toggle]
type = custom/script
exec = ~/.config/polybar/scripts/clock.sh
interval = 1
format-background = ${colors.base}
format-foreground = ${colors.lavender}
click-left = ~/.config/polybar/scripts/clock.sh --toggle
click-right = ~/.config/polybar/scripts/wallpaper-cycle.sh

; -----------------------------------------------------------------------------
; RIGHT ISLAND: Interactive Expandable System Stats + Hardware Controls
; -----------------------------------------------------------------------------
[module/sysinfo_toggle]
type = custom/script
exec = ~/.config/polybar/scripts/sysinfo.sh
interval = 2
format-background = ${colors.base}
format-foreground = ${colors.sapphire}
click-left = ~/.config/polybar/scripts/sysinfo.sh --toggle
click-right = wezterm start -- btop

[module/hw_bright]
type = custom/text
content = "󰃠"
content-background = ${colors.base}
content-foreground = ${colors.yellow}
click-left = ~/.config/polybar/scripts/hw-action.sh bright-cycle
scroll-up = ~/.config/polybar/scripts/hw-action.sh bright-up
scroll-down = ~/.config/polybar/scripts/hw-action.sh bright-down

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume>
format-volume-background = ${colors.base}
label-volume = "󰕾 %percentage%%"
label-volume-foreground = ${colors.mauve}
format-muted-background = ${colors.base}
label-muted = "󰝟"
label-muted-foreground = ${colors.red}
click-right = pavucontrol

[module/net_toggle]
type = custom/script
exec = ~/.config/polybar/scripts/net.sh
interval = 3
format-background = ${colors.base}
format-foreground = ${colors.green}
click-left = ~/.config/polybar/scripts/net.sh --toggle
click-right = ~/.config/rofi/wifi.sh

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 98
low-at = 20
format-charging = "󰂄 <label-charging>"
format-charging-background = ${colors.base}
format-charging-foreground = ${colors.sapphire}
format-discharging = "󰁹 <label-discharging>"
format-discharging-background = ${colors.base}
format-discharging-foreground = ${colors.green}
format-full = "󰁹 <label-full>"
format-full-background = ${colors.base}
format-full-foreground = ${colors.green}
format-low = "󰁺 <label-low>"
format-low-background = ${colors.base}
format-low-foreground = ${colors.red}

[module/systray]
type = internal/tray
format-background = ${colors.base}
format-padding = 1
tray-spacing = 4pt
tray-size = 55%

[module/power]
type = custom/text
content = "%{T2}%{F#f38ba8}%{F-}%{T-}%{B#f38ba8}%{F#11111b} 󰐥 %{F-}%{B-}%{T2}%{F#f38ba8}%{F-}%{T-}"
click-left = ~/.config/rofi/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true
