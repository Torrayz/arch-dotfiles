[colors]
base = #1e1e2e
mantle = #181825
crust = #11111b
text = #cdd6f4
subtext0 = #a6adc8
surface0 = #313244
surface1 = #45475a
overlay0 = #6c7086
mauve = #cba6f7
blue = #89b4fa
sapphire = #74c7ec
green = #a6e3a1
yellow = #f9e2af
peach = #fab387
red = #f38ba8
lavender = #b4befe

[bar/main]
width = 100%
height = 26pt
radius = 0
background = ${colors.base}
foreground = ${colors.text}
line-size = 2pt
border-bottom-size = 1pt
border-bottom-color = ${colors.surface0}
padding-left = 1
padding-right = 1
module-margin = 1
separator = " "
separator-foreground = ${colors.surface1}

font-0 = "JetBrainsMono Nerd Font:size=10:weight=semibold;2"
font-1 = "Noto Sans:size=10;2"

modules-left = launcher xworkspaces xwindow
modules-center = date
modules-right = cpu memory backlight pulseaudio wlan battery systray power

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/launcher]
type = custom/text
content = " 󰣇 "
content-background = ${colors.mauve}
content-foreground = ${colors.crust}
click-left = rofi -show drun

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.surface0}
label-active-underline= ${colors.mauve}
label-active-foreground = ${colors.mauve}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.text}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.crust}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.overlay0}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.subtext0}

[module/date]
type = internal/date
interval = 5
date = "󰥔 %H:%M  󰃭 %a, %d %b"
date-alt = "󰃭 %A, %d %B %Y  󰥔 %H:%M:%S"
label = %date%
label-foreground = ${colors.lavender}

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 5
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.sapphire}
label = %percentage_used:2%%

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format-prefix = "󰃠 "
format-prefix-foreground = ${colors.yellow}
label = %percentage%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.mauve}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = "󰝟 Mute"
label-muted-foreground = ${colors.overlay0}
click-right = pavucontrol

[module/wlan]
type = internal/network
interface = wlp3s0
interface-type = wireless
interval = 5
format-connected = <label-connected>
label-connected = "󰤨 %essid%"
label-connected-foreground = ${colors.green}
format-disconnected = <label-disconnected>
label-disconnected = "󰤭 Offline"
label-disconnected-foreground = ${colors.red}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 98
low-at = 20
format-charging = "󰂄 <label-charging>"
format-charging-foreground = ${colors.sapphire}
format-discharging = "󰁹 <label-discharging>"
format-discharging-foreground = ${colors.green}
format-full = "󰁹 <label-full>"
format-full-foreground = ${colors.green}
format-low = "󰁺 <label-low>"
format-low-foreground = ${colors.red}

[module/systray]
type = internal/tray
format-margin = 4pt
tray-spacing = 8pt

[module/power]
type = custom/text
content = " 󰐥 "
content-background = ${colors.red}
content-foreground = ${colors.crust}
click-left = ~/.config/rofi/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true
