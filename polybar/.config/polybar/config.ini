; =============================================================================
; Polybar Modern Proportional Dock & Inset Pills — Catppuccin Mocha
; Calibrated for 1366x768 Screen (App Logos in Workspaces, Zero Clipping)
; =============================================================================

[colors]
trans    = #00000000
crust    = #cc14110f
mantle   = #d9181825
base     = #e6221d1a
surface0 = #313244
surface1 = #45475a
overlay0 = #6c7086
subtext0 = #a6adc8
text     = #cdd6f4
mauve    = #fab387
blue     = #f9e2af
sapphire = #74c7ec
teal     = #94e2d5
green    = #a6e3a1
yellow   = #f9e2af
peach    = #fab387
red      = #f38ba8
lavender = #b4befe

[bar/main]
width = 100%
height = 22pt
radius = 8.0
background = ${colors.crust}
foreground = ${colors.text}

; Inset margins around every pill inside the bar (creates proportional cards)
line-size = 3pt

; Floating outer margin from screen edges
border-top-size = 3pt
border-bottom-size = 2pt
border-left-size = 6pt
border-right-size = 6pt
border-color = ${colors.trans}

padding-left = 1
padding-right = 1
module-margin = 0

font-0 = "JetBrainsMono Nerd Font:size=8.5:weight=semibold;2"
font-1 = "JetBrainsMono Nerd Font:size=9.5:weight=bold;2"

modules-left = workspaces_apps gap win_size quickclip quickkeys
modules-center = hub gap media gap clock_toggle
modules-right = sysinfo_toggle gap quickwall pulseaudio power_status gap systray gap control_center power

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; -----------------------------------------------------------------------------
; Spacers
; -----------------------------------------------------------------------------
[module/gap]
type = custom/text
format = " "
format-background = ${colors.crust}

; -----------------------------------------------------------------------------
; LEFT: Torray Hub + Workspaces (with Live App Logos!) + Keybindings Only
; -----------------------------------------------------------------------------
[module/hub]
type = custom/text
format = " 󰣇  Hub "
format-background = ${colors.mauve}
format-foreground = ${colors.crust}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = setsid -f ~/.config/polybar/scripts/torray-hub.py --dash >/dev/null 2>&1
click-right = setsid -f rofi -show drun -show-icons >/dev/null 2>&1

[module/workspaces_apps]
type = custom/script
exec = ~/.config/polybar/scripts/workspaces.py
tail = true
format = <label>
format-overline = ${colors.crust}
format-underline = ${colors.crust}
label = %output%

[module/win_size]
type = custom/script
exec = ~/.config/polybar/scripts/win-layout.sh status
interval = 1
format-background = ${colors.base}
format-foreground = ${colors.sapphire}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
click-left = ~/.config/polybar/scripts/win-layout.sh cycle >/dev/null 2>&1
click-right = setsid -f ~/.config/polybar/scripts/win-layout.sh menu >/dev/null 2>&1
scroll-up = ~/.config/polybar/scripts/win-layout.sh grow-both >/dev/null 2>&1
scroll-down = ~/.config/polybar/scripts/win-layout.sh shrink-both >/dev/null 2>&1

[module/quickclip]
type = custom/text
format = " 󰅌  "
format-background = ${colors.base}
format-foreground = ${colors.yellow}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = setsid -f ~/.config/polybar/scripts/torray-clip.py --popup >/dev/null 2>&1

[module/quickkeys]
type = custom/text
format = " 󰌌  "
format-background = ${colors.base}
format-foreground = ${colors.peach}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = setsid -f ~/.config/rofi/keybindings.sh >/dev/null 2>&1

; -----------------------------------------------------------------------------
; CENTER: Live Music & Visualizer Pill + Expandable Clock Pill
; -----------------------------------------------------------------------------
[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media.sh
interval = 1
format-background = ${colors.surface0}
format-foreground = ${colors.teal}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
click-left = setsid -f ~/.config/polybar/scripts/torray-hub.py --music >/dev/null 2>&1
click-right = ~/.config/polybar/scripts/media.sh --play-pause >/dev/null 2>&1
scroll-up = ~/.config/polybar/scripts/media.sh --next >/dev/null 2>&1
scroll-down = ~/.config/polybar/scripts/media.sh --prev >/dev/null 2>&1

[module/clock_toggle]
type = custom/script
exec = ~/.config/polybar/scripts/clock.sh
interval = 1
format-background = ${colors.base}
format-foreground = ${colors.lavender}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
click-left = ~/.config/polybar/scripts/clock.sh --toggle
click-right = setsid -f ~/.config/polybar/scripts/torray-hub.py --wall >/dev/null 2>&1

; -----------------------------------------------------------------------------
; RIGHT: Expandable System Stats + Wallpaper Studio + Hardware Controls + Power
; -----------------------------------------------------------------------------
[module/sysinfo_toggle]
type = custom/script
exec = ~/.config/polybar/scripts/sysinfo.sh
interval = 2
format-background = ${colors.base}
format-foreground = ${colors.sapphire}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
click-left = ~/.config/polybar/scripts/sysinfo.sh --toggle
click-right = setsid -f wezterm start -- btop >/dev/null 2>&1

[module/quickwall]
type = custom/text
format = " 󰸉  "
format-background = ${colors.base}
format-foreground = ${colors.mauve}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = setsid -f ~/.config/polybar/scripts/torray-hub.py --wall >/dev/null 2>&1
click-right = ~/.config/polybar/scripts/wallpaper-cycle.sh >/dev/null 2>&1

[module/hw_bright]
type = custom/text
format = " 󰃠  "
format-background = ${colors.base}
format-foreground = ${colors.yellow}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = ~/.config/polybar/scripts/hw-action.sh bright-cycle
click-right = setsid -f ~/.config/polybar/scripts/torray-hub.py --dash >/dev/null 2>&1
scroll-up = ~/.config/polybar/scripts/hw-action.sh bright-up
scroll-down = ~/.config/polybar/scripts/hw-action.sh bright-down

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume>
format-volume-background = ${colors.base}
format-volume-overline = ${colors.crust}
format-volume-underline = ${colors.crust}
format-volume-padding = 1
label-volume = "󰕾  %percentage%%"
label-volume-foreground = ${colors.mauve}
format-muted-background = ${colors.base}
format-muted-overline = ${colors.crust}
format-muted-underline = ${colors.crust}
format-muted-padding = 1
label-muted = "󰝟  Mute"
label-muted-foreground = ${colors.red}
click-right = setsid -f ~/.config/polybar/scripts/torray-hub.py --dash >/dev/null 2>&1

[module/net_toggle]
type = custom/script
exec = ~/.config/polybar/scripts/net.sh
interval = 3
format-background = ${colors.base}
format-foreground = ${colors.green}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
click-left = ~/.config/polybar/scripts/net.sh --toggle
click-right = setsid -f ~/.config/rofi/wifi.sh >/dev/null 2>&1

[module/power_status]
type = custom/script
exec = ~/.config/polybar/scripts/power-status.sh
interval = 5
format-background = ${colors.base}
format-foreground = ${colors.sapphire}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
click-left = ~/.config/polybar/scripts/power-status.sh --toggle
click-right = setsid -f ~/.config/polybar/scripts/torray-hub.py --dash >/dev/null 2>&1

[module/systray]
type = internal/tray
format-background = ${colors.base}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
tray-spacing = 4pt
tray-size = 58%

[module/power]
type = custom/text
format = " 󰐥 "
format-background = ${colors.red}
format-foreground = ${colors.crust}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = setsid -f ~/.config/rofi/powermenu.sh >/dev/null 2>&1

[module/control_center]
type = custom/text
format = " 󰒓 "
format-background = ${colors.base}
format-foreground = ${colors.text}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
tooltip = Open quick settings
click-left = setsid -f ~/.config/rofi/control-center.sh >/dev/null 2>&1

[settings]
screenchange-reload = true
pseudo-transparency = true
