; =============================================================================
; Polybar Modern Proportional Dock & Inset Pills — Catppuccin Mocha
; Calibrated for 1366x768 Screen (Zero Clipping, Mutual-Exclusion Expandable)
; =============================================================================

[colors]
trans    = #00000000
crust    = #11111b
mantle   = #181825
base     = #1e1e2e
surface0 = #313244
surface1 = #45475a
overlay0 = #6c7086
subtext0 = #a6adc8
text     = #cdd6f4
mauve    = #cba6f7
blue     = #89b4fa
sapphire = #74c7ec
teal     = #94e2d5
green    = #a6e3a1
yellow   = #f9e2af
peach    = #fab387
red      = #f38ba8
lavender = #b4befe

[bar/main]
width = 100%
height = 22pt
radius = 8.0
background = ${colors.crust}
foreground = ${colors.text}

; Inset margins around every pill inside the bar (creates proportional cards)
line-size = 3pt

; Floating outer margin from screen edges
border-top-size = 3pt
border-bottom-size = 2pt
border-left-size = 6pt
border-right-size = 6pt
border-color = ${colors.trans}

padding-left = 1
padding-right = 1
module-margin = 0

font-0 = "JetBrainsMono Nerd Font:size=8.5:weight=semibold;2"
font-1 = "JetBrainsMono Nerd Font:size=9.5:weight=bold;2"

modules-left = hub gap xworkspaces gap quickterm quickcode quickwall quickkeys
modules-center = media gap clock_toggle
modules-right = sysinfo_toggle gap hw_bright pulseaudio net_toggle power_status gap systray gap power

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; -----------------------------------------------------------------------------
; Spacers
; -----------------------------------------------------------------------------
[module/gap]
type = custom/text
format = " "
format-background = ${colors.crust}

; -----------------------------------------------------------------------------
; LEFT: Torray Hub Plugin Button + Proportional Workspaces + Quick Studio Bar
; -----------------------------------------------------------------------------
[module/hub]
type = custom/text
format = " 󰣇  Hub "
format-background = ${colors.mauve}
format-foreground = ${colors.crust}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = ~/.config/polybar/scripts/torray-hub.py --dash &
click-right = rofi -show drun -show-icons

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = false
enable-click = true
enable-scroll = true

format = <label-state>
format-overline = ${colors.crust}
format-underline = ${colors.crust}

label-active = " %name% "
label-active-foreground = ${colors.crust}
label-active-background = ${colors.blue}
label-active-overline = ${colors.crust}
label-active-underline = ${colors.crust}

label-occupied = " %name% "
label-occupied-foreground = ${colors.text}
label-occupied-background = ${colors.surface0}
label-occupied-overline = ${colors.crust}
label-occupied-underline = ${colors.crust}

label-urgent = " %name%! "
label-urgent-foreground = ${colors.crust}
label-urgent-background = ${colors.red}
label-urgent-overline = ${colors.crust}
label-urgent-underline = ${colors.crust}

label-empty = " %name% "
label-empty-foreground = ${colors.overlay0}
label-empty-background = ${colors.base}
label-empty-overline = ${colors.crust}
label-empty-underline = ${colors.crust}

[module/quickterm]
type = custom/text
format = " 󰆍  "
format-background = ${colors.base}
format-foreground = ${colors.green}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = wezterm start

[module/quickcode]
type = custom/text
format = " 󰨞  "
format-background = ${colors.base}
format-foreground = ${colors.blue}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = code

[module/quickwall]
type = custom/text
format = " 󰸉  "
format-background = ${colors.base}
format-foreground = ${colors.mauve}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = ~/.config/polybar/scripts/torray-hub.py --wall &
click-right = ~/.config/polybar/scripts/wallpaper-cycle.sh

[module/quickkeys]
type = custom/text
format = " 󰌌  "
format-background = ${colors.base}
format-foreground = ${colors.peach}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = ~/.config/rofi/keybindings.sh

; -----------------------------------------------------------------------------
; CENTER: Live Music & Visualizer Pill + Expandable Clock Pill
; -----------------------------------------------------------------------------
[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media.sh
interval = 1
format-background = ${colors.surface0}
format-foreground = ${colors.teal}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
click-left = ~/.config/polybar/scripts/media.sh --play-pause
click-right = ~/.config/polybar/scripts/media.sh --hub
scroll-up = ~/.config/polybar/scripts/media.sh --next
scroll-down = ~/.config/polybar/scripts/media.sh --prev

[module/clock_toggle]
type = custom/script
exec = ~/.config/polybar/scripts/clock.sh
interval = 1
format-background = ${colors.base}
format-foreground = ${colors.lavender}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
click-left = ~/.config/polybar/scripts/clock.sh --toggle
click-right = ~/.config/polybar/scripts/torray-hub.py --wall &

; -----------------------------------------------------------------------------
; RIGHT: Expandable System Stats + Hardware Controls + Power
; -----------------------------------------------------------------------------
[module/sysinfo_toggle]
type = custom/script
exec = ~/.config/polybar/scripts/sysinfo.sh
interval = 1
format-background = ${colors.base}
format-foreground = ${colors.sapphire}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
click-left = ~/.config/polybar/scripts/sysinfo.sh --toggle
click-right = wezterm start -- btop

[module/hw_bright]
type = custom/text
format = " 󰃠  "
format-background = ${colors.base}
format-foreground = ${colors.yellow}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = ~/.config/polybar/scripts/hw-action.sh bright-cycle
click-right = ~/.config/polybar/scripts/torray-hub.py --dash &
scroll-up = ~/.config/polybar/scripts/hw-action.sh bright-up
scroll-down = ~/.config/polybar/scripts/hw-action.sh bright-down

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume>
format-volume-background = ${colors.base}
format-volume-overline = ${colors.crust}
format-volume-underline = ${colors.crust}
format-volume-padding = 1
label-volume = "󰕾  %percentage%%"
label-volume-foreground = ${colors.mauve}
format-muted-background = ${colors.base}
format-muted-overline = ${colors.crust}
format-muted-underline = ${colors.crust}
format-muted-padding = 1
label-muted = "󰝟  Mute"
label-muted-foreground = ${colors.red}
click-right = ~/.config/polybar/scripts/torray-hub.py --dash &

[module/net_toggle]
type = custom/script
exec = ~/.config/polybar/scripts/net.sh
interval = 1
format-background = ${colors.base}
format-foreground = ${colors.green}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
click-left = ~/.config/polybar/scripts/net.sh --toggle
click-right = ~/.config/rofi/wifi.sh

[module/power_status]
type = custom/script
exec = ~/.config/polybar/scripts/power-status.sh
interval = 1
format-background = ${colors.base}
format-foreground = ${colors.sapphire}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
click-left = ~/.config/polybar/scripts/power-status.sh --toggle
click-right = ~/.config/polybar/scripts/torray-hub.py --dash &

[module/systray]
type = internal/tray
format-background = ${colors.base}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
format-padding = 1
tray-spacing = 4pt
tray-size = 58%

[module/power]
type = custom/text
format = " 󰐥 "
format-background = ${colors.red}
format-foreground = ${colors.crust}
format-overline = ${colors.crust}
format-underline = ${colors.crust}
click-left = ~/.config/rofi/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true
